    <text x="160" y="244" font-size="11" fill="#FFFFFF" opacity="0.8" text-anchor="middle">kategori · populer · terbaru</text>
    <text x="160" y="262" font-size="11" fill="#FFFFFF" opacity="0.8" text-anchor="middle">pencarian</text>

