    <line x1="260" y1="234" x2="342" y2="234" stroke="#5C6B68" stroke-width="2"/>
    <polygon points="350,234 338,228 338,240" fill="#5C6B68"/>
    <text x="300" y="224" font-size="10" fill="#5C6B68" text-anchor="middle">push</text>

