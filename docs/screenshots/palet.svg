<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#FFFFFF"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2A28">Palet Warna Tapak</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5C6B68">Primary, secondary, netral, dan aksen kategori</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="110" width="120" height="90" rx="12" fill="#2F6F5E"/>
    <text x="40" y="222" font-size="13" font-weight="700" fill="#1E2A28">Primary</text>
    <text x="40" y="242" font-size="12" fill="#5C6B68">#2F6F5E</text>

    <rect x="180" y="110" width="120" height="90" rx="12" fill="#F2A65A"/>
    <text x="180" y="222" font-size="13" font-weight="700" fill="#1E2A28">Secondary</text>
    <text x="180" y="242" font-size="12" fill="#5C6B68">#F2A65A</text>

    <rect x="320" y="110" width="120" height="90" rx="12" fill="#F7F5F0" stroke="#DDD8CE"/>
    <text x="320" y="222" font-size="13" font-weight="700" fill="#1E2A28">Background</text>
    <text x="320" y="242" font-size="12" fill="#5C6B68">#F7F5F0</text>

    <rect x="460" y="110" width="120" height="90" rx="12" fill="#1E2A28"/>
    <text x="460" y="222" font-size="13" font-weight="700" fill="#1E2A28">Teks Utama</text>
    <text x="460" y="242" font-size="12" fill="#5C6B68">#1E2A28</text>

    <rect x="600" y="110" width="120" height="90" rx="12" fill="#5C6B68"/>
    <text x="600" y="222" font-size="13" font-weight="700" fill="#1E2A28">Teks Sekunder</text>
    <text x="600" y="242" font-size="12" fill="#5C6B68">#5C6B68</text>

    <rect x="740" y="110" width="120" height="90" rx="12" fill="#DCEAE4"/>
    <text x="740" y="222" font-size="13" font-weight="700" fill="#1E2A28">Container</text>
    <text x="740" y="242" font-size="12" fill="#5C6B68">#DCEAE4</text>
  </g>

  <line x1="40" y1="276" x2="860" y2="276" stroke="#EDE9E1"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="306" font-size="13" font-weight="700" fill="#1E2A28">Aksen kategori:</text>

    <rect x="180" y="288" width="22" height="22" rx="6" fill="#D97757"/>
