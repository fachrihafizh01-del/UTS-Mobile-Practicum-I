    <rect x="340" y="288" width="22" height="22" rx="6" fill="#3E7C8C"/>
    <text x="370" y="305" font-size="12" fill="#5C6B68">Punggung</text>

    <rect x="480" y="288" width="22" height="22" rx="6" fill="#C89B3C"/>
    <text x="510" y="305" font-size="12" fill="#5C6B68">Pergelangan</text>

    <rect x="640" y="288" width="22" height="22" rx="6" fill="#7A6A9B"/>
    <text x="670" y="305" font-size="12" fill="#5C6B68">Kaki</text>
